name: Feature request
description: Suggest something you would like the tracker to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You do not need to fill in every box, and a rough idea is
        genuinely welcome. If you would rather just think out loud, the
        [Discussions](https://github.com/Daniel-Waiger/Core-Facility-CRM/discussions) board is
        the easier place to start.

  - type: textarea
    id: what
    attributes:
      label: What would you like to be able to do?
      description: Describe it the way you would say it out loud.
      placeholder: I would like to tag a booking with the technique we used, like SIM or TIRF.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would that help you?
      description: >
        What are you trying to get done, or what do you do today instead? This matters more than
        the feature itself, because it often points at a simpler answer.
      placeholder: >
        When I ask for budget for a new laser I want to show how often that technique is
        actually booked.
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: Which part of the app?
      description: A rough guess is fine, and "not sure" is a real answer.
      options:
        - Not sure
        - Dashboard
        - Projects
        - Milestones
        - Calendar and bookings
        - People and labs
        - Instruments
        - Service entries
        - Reports and utilization
        - Settings, billing, grants
        - Exports (XLSX, DOCX, PDF)
        - Backups and restore
        - Something else
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version you are using
      description: Settings shows it at the bottom, next to "Version".
      placeholder: "1.9.1"
    validations:
      required: false
